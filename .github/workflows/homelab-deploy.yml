name: Deploy to homelab

on:
  push:
    branches:
      - trunk

concurrency:
  group: homelab-deploy
  cancel-in-progress: false

jobs:
  build:
    name: Build image
    runs-on: [self-hosted, homelab]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t bastubot:latest .
