# Checks every PR into trunk before it can be merged. A branch ruleset on
# trunk should require the "Checks" job below to pass, so renaming the job
# means updating the ruleset too.
name: Checks

on:
  pull_request:
    branches:
      - trunk

# A new push to the same PR cancels the run that's still going
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    # GitHub's runners, never the homelab one: the repo is public, so a PR
    # from a fork would run a stranger's code on the homelab
    runs-on: ubuntu-latest

    # Nothing here launches a browser, so skip puppeteer's Chromium download
    # during npm ci
    env:
      PUPPETEER_SKIP_DOWNLOAD: true

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # Caches the npm cache between runs, keyed on package-lock.json
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm ci fails if package.json and package-lock.json disagree
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      # tsc is also the typecheck, with strict on in tsconfig.json
      - name: Build
        run: npm run build
